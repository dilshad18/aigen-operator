apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aigens.infra.whiz.ai
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-weight": "-5"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
spec:
  group: infra.whiz.ai
  scope: Namespaced
  names:
    plural: aigens
    singular: aigen
    kind: AIGen
    shortNames:
      - aigen
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Active Deployment
          type: string
          jsonPath: .status.activeDeployment
        - name: Namespace
          type: string
          jsonPath: .status.activeNamespace
        - name: Replicas
          type: integer
          jsonPath: .status.activeReplicas
        - name: Last Sync
          type: string
          jsonPath: .status.lastSyncTime
        - name: GPU Count
          type: integer
          jsonPath: .status.totalGpuCount
        - name: GPU Memory (GB)
          type: number
          jsonPath: .status.totalGpuMemoryGB
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetNamespace:
                  type: string
                cpuDeployment:
                  type: string
                gpuDeployment:
                  type: string
                replicas:
                  type: integer
                  default: 1
                requiredGpuMemoryGB:
                  type: number
                  description: "Required GPU memory in GB. The operator sums nvidia.com/gpu.memory labels (MB) across GPU nodes, converts to GB, and schedules the GPU deployment only if total >= this value."
            status:
              type: object
              properties:
                lastSyncTime:
                  type: string
                activeDeployment:
                  type: string
                activeNamespace:
                  type: string
                message:
                  type: string
                activeReplicas:
                  type: integer
                totalGpuCount:
                  type: integer
                  description: "Total number of GPUs available across all schedulable GPU nodes."
                totalGpuMemoryGB:
                  type: number
                  description: "Total GPU memory available across all schedulable GPU nodes, in GB."
